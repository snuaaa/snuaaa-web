name: Merge Command

# PR에 `/merge` 코멘트를 달면 (일반 코멘트, 리뷰 본문, 리뷰의 라인 코멘트 모두) 브랜치 규칙에 맞는 방식으로 머지한다.
#
#   main   <- epic/*                       : merge commit
#   main   <- feat|fix|chore|refactor/*    : squash
#   epic/* <- feat|fix|chore|refactor/*    : squash
#   epic/* <- sync/*                       : merge commit (epic 수동 동기화)
#
# epic -> main PR에 `/sync` 코멘트를 달면 main을 epic에 merge commit으로 반영한다.
# (PR 화면의 Update branch와 같은 동작. 사람은 epic 브랜치를 직접 갱신할 수 없다)
# 충돌 등으로 `/sync`를 쓸 수 없으면 epic에서 `sync/*` 브랜치를 따서 main을 머지하고
# epic으로 PR을 올린다. squash하면 main 커밋이 중복되므로 merge commit으로 머지한다.
#
# 머지와 동기화는 머지 봇 GitHub App 토큰으로 한다. 기본 GITHUB_TOKEN으로 push하면
# main·epic push가 배포 워크플로를 트리거하지 않기 때문이다.
# 필요한 secrets: MERGE_BOT_APP_ID, MERGE_BOT_PRIVATE_KEY
# App 권한: Contents, Pull requests, Issues (Read & write), Checks, Commit statuses (Read)
#
# 명령 처리 로직은 .github/scripts/merge-command.js에 있고, 항상 기본 브랜치에서 checkout해 실행한다.
# issue_comment 워크플로는 기본 브랜치의 워크플로 파일로 실행되지만,
# pull_request_review(_comment) 워크플로는 PR의 merge ref에 있는 워크플로 파일로 실행된다.
# 그래서 PR 브랜치가 이 트리거를 추가하기 전의 main에서 갈라졌다면 리뷰 속 `/merge`는 동작하지 않는다
# (main을 반영하거나 일반 코멘트로 달면 된다). fork PR의 리뷰 이벤트에는 secrets가 전달되지 않아서
# 머지 봇 토큰을 만들 수 없으므로, fork PR은 일반 코멘트로 `/merge`해야 한다.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: merge-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event.issue.pull_request || github.event.pull_request) &&
      (startsWith(github.event.comment.body || github.event.review.body, '/merge') ||
      startsWith(github.event.comment.body || github.event.review.body, '/sync'))
    runs-on: ubuntu-latest
    steps:
      # 리뷰 이벤트의 기본 checkout 대상은 PR 코드이므로, 명령 로직은 기본 브랜치에서 가져온다
      - name: Checkout merge command script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Create merge bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}

      - name: Run command
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/merge-command.js`);
            await run({ github, context, core });

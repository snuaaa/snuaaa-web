name: CI

on:
  pull_request:
    branches:
      - main
      - 'epic/**'
  # hotfix/*는 PR 없이 태그로 릴리스하므로 push마다 검사한다
  push:
    branches:
      - 'hotfix/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @snuaaa/community-web lint

      - name: Typecheck
        run: pnpm --filter @snuaaa/community-web typecheck

      - name: Build
        run: pnpm --filter @snuaaa/community-web build

  api:
    name: API (lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @snuaaa/api lint

      - name: Format check
        run: pnpm --filter @snuaaa/api format:check

      - name: Build
        run: pnpm --filter @snuaaa/api build

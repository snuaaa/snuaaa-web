name: Release notes

# WEB-*/API-* 릴리즈 노트를 해당 패키지 경로를 바꾼 PR만으로 채운다.
# GitHub 자동 생성은 경로를 구분하지 않아 web/api 변경이 섞이므로 대신 사용한다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '노트를 다시 만들 릴리즈 태그 (예: WEB-1.8.2)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'WEB-') || startsWith(github.event.release.tag_name || inputs.tag, 'API-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate notes
        run: .github/scripts/release-notes.sh "$TAG" "$GH_REPO" > generated.md

      # 생성 결과는 마커 사이에 둔다. 마커가 있으면 그 사이만 교체하고,
      # 없으면 직접 쓴 본문 아래에 붙인다. 마커 밖의 내용은 건드리지 않는다.
      - name: Update release body
        run: |
          gh release view "$TAG" --json body --jq .body | tr -d '\r' > current.md
          start='<!-- release-notes:start -->'
          end='<!-- release-notes:end -->'
          { echo "$start"; cat generated.md; echo "$end"; } > block.md
          if grep -qF "$start" current.md && grep -qF "$end" current.md; then
            awk -v s="$start" -v e="$end" -v f=block.md '
              $0 == s { while ((getline l < f) > 0) print l; skip = 1; next }
              $0 == e { skip = 0; next }
              !skip
            ' current.md > body.md
          elif [ -s current.md ]; then
            { cat current.md; echo; cat block.md; } > body.md
          else
            cp block.md body.md
          fi
          gh release edit "$TAG" --notes-file body.md
